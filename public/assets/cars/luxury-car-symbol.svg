<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldCarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A24A" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#E5C77B" stop-opacity="1" />
      <stop offset="100%" stop-color="#C9A24A" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="silverGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d9d9d9" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A24A" stop-opacity="0" />
      <stop offset="25%" stop-color="#C9A24A" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#E5C77B" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#C9A24A" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#C9A24A" stop-opacity="0" />
    </linearGradient>
    <filter id="carNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ground Horizon Speed Line -->
  <path d="M 50 375 L 1150 375" stroke="url(#glowLine)" stroke-width="2.5" opacity="0.4" />
  <path d="M 120 380 L 1080 380" stroke="#C9A24A" stroke-width="1" opacity="0.25" stroke-dasharray="16, 12" />

  <!-- Sleek Aerodynamic Roofline & Body Silhouette -->
  <!-- Low front nose at (140, 340) -> hood -> windshield -> roof apex at (590, 140) -> rear slope -> tail at (1040, 310) -->
  <path d="M 140 345 
           C 180 340, 240 330, 290 310 
           C 340 290, 410 245, 480 200 
           C 540 160, 600 135, 680 135 
           C 760 135, 830 155, 890 200 
           C 950 245, 1000 290, 1040 315 
           C 1060 328, 1075 345, 1070 355
           C 1060 365, 1030 365, 1010 365
           L 965 365"
        stroke="url(#goldCarGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#carNeonGlow)" />

  <!-- Secondary Dynamic Character / Shoulder Line -->
  <path d="M 195 320 
           C 255 305, 335 285, 430 270 
           C 530 255, 690 250, 830 265 
           C 900 272, 970 295, 1035 325"
        stroke="#E5C77B" stroke-width="2.2" opacity="0.85" stroke-linecap="round" />

  <!-- Side Window Glass Silhouette (Dark Luxury Tint) -->
  <path d="M 495 210 
           C 545 175, 610 155, 680 155 
           C 745 155, 805 172, 855 210 
           C 870 222, 860 252, 835 252 
           C 740 242, 600 242, 500 252 
           C 480 252, 475 225, 495 210 Z"
        fill="rgba(201, 162, 74, 0.08)" stroke="#E5C77B" stroke-width="1.8" opacity="0.9" />

  <!-- B-Pillar Divider Line -->
  <line x1="680" y1="156" x2="675" y2="243" stroke="#C9A24A" stroke-width="2" opacity="0.7" />

  <!-- Front Headlight LED DRL Signature (Aggressive Luxury Swoop) -->
  <path d="M 155 330 
           C 185 325, 230 315, 260 312 
           L 245 322 
           C 220 325, 185 332, 160 338 Z"
        fill="#ffffff" opacity="0.95" filter="url(#carNeonGlow)" />
  <path d="M 160 330 L 260 312" stroke="#ffffff" stroke-width="3" filter="url(#carNeonGlow)" />

  <!-- Rear OLED Tail Light Signature -->
  <path d="M 1025 320 
           C 1050 328, 1065 338, 1060 348 
           L 1045 348 
           C 1048 340, 1035 332, 1015 326 Z"
        fill="#C9A24A" opacity="0.95" filter="url(#carNeonGlow)" />

  <!-- Front Wheel Arch & Wheel Assembly (Sleek Alloy) -->
  <!-- Front Wheel Center at (330, 360), Radius 62 -->
  <path d="M 255 365 A 75 75 0 0 1 405 365" stroke="#C9A24A" stroke-width="3.5" fill="none" opacity="0.9" />
  <circle cx="330" cy="360" r="58" stroke="url(#goldCarGrad)" stroke-width="3" fill="#080808" />
  <circle cx="330" cy="360" r="42" stroke="#d9d9d9" stroke-width="1.5" opacity="0.6" />
  <circle cx="330" cy="360" r="22" stroke="#C9A24A" stroke-width="2.5" fill="#141414" />
  <!-- Multi-Spoke Rims Front -->
  <line x1="330" y1="318" x2="330" y2="402" stroke="#E5C77B" stroke-width="1.8" opacity="0.8" />
  <line x1="288" y1="360" x2="372" y2="360" stroke="#E5C77B" stroke-width="1.8" opacity="0.8" />
  <line x1="300" y1="330" x2="360" y2="390" stroke="#E5C77B" stroke-width="1.8" opacity="0.8" />
  <line x1="300" y1="390" x2="360" y2="330" stroke="#E5C77B" stroke-width="1.8" opacity="0.8" />

  <!-- Rocker Panel / Bottom Skirt Line Between Wheels -->
  <line x1="405" y1="365" x2="825" y2="365" stroke="#E5C77B" stroke-width="3" opacity="0.85" />
  <line x1="415" y1="358" x2="815" y2="358" stroke="#C9A24A" stroke-width="1" opacity="0.5" />

  <!-- Rear Wheel Arch & Wheel Assembly -->
  <!-- Rear Wheel Center at (900, 360), Radius 62 -->
  <path d="M 825 365 A 75 75 0 0 1 975 365" stroke="#C9A24A" stroke-width="3.5" fill="none" opacity="0.9" />
  <circle cx="900" cy="360" r="58" stroke="url(#goldCarGrad)" stroke-width="3" fill="#080808" />
  <circle cx="900" cy="360" r="42" stroke="#d9d9d9" stroke-width="1.5" opacity="0.6" />
  <circle cx="900" cy="360" r="22" stroke="#C9A24A" stroke-width="2.5" fill="#141414" />
  <!-- Multi-Spoke Rims Rear -->
  <line x1="900" y1="318" x2="900" y2="402" stroke="#E5C77B" stroke-width="1.8" opacity="0.8" />
  <line x1="858" y1="360" x2="942" y2="360" stroke="#E5C77B" stroke-width="1.8" opacity="0.8" />
  <line x1="870" y1="330" x2="930" y2="390" stroke="#E5C77B" stroke-width="1.8" opacity="0.8" />
  <line x1="870" y1="390" x2="930" y2="330" stroke="#E5C77B" stroke-width="1.8" opacity="0.8" />

  <!-- Front Lower Splitter & Air Dam -->
  <path d="M 140 345 C 160 362, 200 365, 255 365" stroke="#C9A24A" stroke-width="2.5" opacity="0.8" />

  <!-- PCC INDIA Corporate Badge Center Watermark -->
  <g transform="translate(600, 90)" opacity="0.75">
    <circle cx="0" cy="0" r="24" stroke="#C9A24A" stroke-width="1.5" fill="none" />
    <polygon points="0,-16 4,-4 16,-4 7,4 10,16 0,8 -10,16 -7,4 -16,-4 -4,-4" fill="#E5C77B" opacity="0.9" />
  </g>
</svg>

